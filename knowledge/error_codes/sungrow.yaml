schema_version: 2
vendor: Sungrow
protocol: OCPP
codes:
  S3:
    canonical_event: vehicle_emergency_stop
    meaning: EV_E_Stop
    origin: vehicle
    description: Vehicle-side emergency stop reported by the charging controller.
    diagnostic_role: symptom
    confidence: high
    notes:
    - The code identifies the stop category, not the underlying trigger.
    - Correlate with CP and ISO 15118 events before assigning a root cause.
  S20:
    canonical_event: frame_communication_timeout
    meaning: Frame_Communication_Timeout
    origin: charging_controller
    description: The EV did not send the next expected ISO 15118 request before the frame timeout.
    diagnostic_role: symptom
    confidence: high
    notes:
    - S20 identifies the communication timeout stop category, not the underlying cause.
    - Correlate the timeout with CP/unplug state and verify that the code clears when the connector returns to idle.
