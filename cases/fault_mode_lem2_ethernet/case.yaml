id: fault_mode_lem2_ethernet
title: IDC180E Connector 2 fault mode after LEM communication loss
detector: lem2_internal_ethernet_fault
input: 'C:\failure case logs\Fault Mode issue.zip'
scope: non_charging_incident

incident:
  start: '2026-05-28T07:49:30Z'
  end: '2026-05-30T08:03:00Z'

source_selection:
  serial_number: A2491508085
  modules:
    - MainProcess
    - Fault_State2
  include_rotated: true

ground_truth:
  symptom: >
    Connector 2 entered Fault and the platform displayed Meter Offline plus
    multiple LEM, CP State E, and TCU configuration faults.
  root_cause: >
    TCU communication with Connector 2's LEM/DC meter at 192.168.10.2 was
    repeatedly lost. The log localizes the issue to the Connector 2 internal
    Ethernet path or endpoint, but does not yet prove that the Ethernet cable
    itself is defective.
  confidence: medium
  confirmation_status: probable
  trigger_hypothesis: >
    An intermittent RJ45 connection between TCU eth1/router and LEM2 caused
    link flaps, meter timeout L20, a group of invalid/unavailable LEM status
    bits, and the Connector 2 Fault state.
  missing_proof:
    - Continuous ping loss to 192.168.10.2 captured during an eth1 flap.
    - Verbose HTTP results from 192.168.10.2/v1/status and /v2/status during failure.
    - RJ45 cable-tester result before and after reseating or replacing the cable.
    - A/B isolation of cable, router/switch port, TCU eth1, and LEM2 hardware.
  customer_context_needed:
    - Whether Connector 2 or its Ethernet cable was serviced before May 25.
    - Whether vibration, door movement, moisture, or cable strain reproduces the fault.

expected:
  findings:
    - connector2_lem_communication_loss_confirmed
    - connector2_internal_ethernet_path_fault_probable
  forbidden_findings:
    - independent_multiple_lem_hardware_faults
    - connector1_meter_failure
    - external_wan_outage

metadata:
  charger_model: 180E
  charger_serial_number: A2491508085
  connector_id: 2
  lem_ip: 192.168.10.2
  platform_timezone: UTC+3
