id: solaredge_4g_eth1_manager_conflict
title: SolarEdge disconnection during 4G channel switching
detector: network_manager_ownership_conflict
input: 'C:\failure case logs\Solareldisconnection 4Gchannelswitching.zip'
scope: incident_window

incident:
  start: '2026-08-10T09:50:40Z'
  end: '2026-08-10T16:39:30Z'

source_selection:
  serial_number: A24C0215369
  modules:
    - router_network
    - network
    - MainProcess
    - ocpp
  include_rotated: true
  include_files:
    # This global DLM log is an explicit exception to the SN+V rule.
    - dlm-network.log

ground_truth:
  symptom: >
    SolarEdge connectivity was reported disconnected during network mode switching;
    OCPP connectivity was intermittent rather than continuously unavailable.
  root_cause: >
    Network mode transitions and competing DLM/ALM and 4G router management of eth1
    are a plausible cause. After DLM/ALM management stopped, routerMode took over;
    several router scripts were marked ready to kill, and backend connectivity later
    recovered. The sequence is correlated but does not establish direct causation.
  confidence: medium
  confirmation_status: probable
  missing_proof:
    - Direct process or netlink evidence showing both managers writing eth1 simultaneously.
    - Process-exit evidence confirming that scripts marked ready to kill actually terminated.

expected:
  findings:
    - eth1_network_manager_conflict_probable
  forbidden_findings:
    - vehicle_emergency_stop
    - isolation_invalid_during_cablecheck
    - precharge_voltage_diff_trip

metadata:
  confirmed_by: field_log_analysis
  notes: DNS gateway was already reachable before takeover, so this is not labeled as a DNS root cause.
