ground_truth:
  symptom: >
    Connector 1 C36 remains active after the emergency button is released,
    while C2 and C37 clear.
  root_cause: >
    C36 is CCU alarm 80 for non-forced CP State E. It was active before the
    emergency-button event and has an independent lifecycle from C2/C37.
  confidence: high
  confirmation_status: confirmed
  trigger_hypothesis: >
    Connector 1 intermittently enters a genuine or sampled CP State E.
  missing_proof:
    - Physical CP-to-PE voltage during active C36.
    - Oscilloscope capture of short CP voltage dips.

