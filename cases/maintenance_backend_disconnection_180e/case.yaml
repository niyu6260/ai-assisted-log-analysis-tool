id: maintenance_backend_disconnection_180e
title: IDC180E maintenance backend repeatedly disconnects
detector: maintenance_backend_disconnect
input: 'C:\failure case logs\Maintenance backend disconnection.zip'
scope: non_charging_incident

incident:
  start: '2026-04-21T00:00:00Z'
  end: '2026-04-23T00:05:00Z'

source_selection:
  serial_number: A2452508759
  modules:
    - MainProcess
    - network
    - router_network
    - ocpp
    - ocppSungrow
  include_rotated: true

ground_truth:
  symptom: >
    The IDC180E repeatedly loses only the Sungrow maintenance backend connection.
    The customer OCPP backend and SIM appear operational. WebSocket closes are marked
    remote=true, and a similar issue was reported on April 8.
  root_cause: >
    No root cause is confirmed. The evidence isolates the failure to the network path
    or service used by the maintenance backend. A cellular reset and changed DHCP
    address coincide with recovery, but the logs do not prove an IP configuration
    change, SIM failure, carrier routing/NAT issue, firewall issue, or backend fault.
  confidence: low
  confirmation_status: inconclusive
  trigger_hypothesis: >
    Destination-specific routing, source-IP/NAT policy, firewall behavior, or the
    maintenance backend itself may have rejected or failed to route the connection.
  missing_proof:
    - ip addr, ip route, ip rule, and all route tables captured during the outage.
    - DNS result and TCP/traceroute comparison for ioteu.suncharger.cn:1888 and the customer backend.
    - Packet capture showing where the maintenance connection fails.
    - Carrier NAT/public source IP and maintenance-backend firewall/server logs.
    - Controlled A/B result using the orange TCU SIM.
  customer_context_needed:
    - Whether any APN, VPN, firewall, or IP allowlist changed before April 7.
    - Exact recurrence timestamps and whether other chargers using the same SIM/carrier were affected.

expected:
  findings:
    - maintenance_backend_prolonged_disconnection_confirmed
    - maintenance_backend_network_path_unresolved
  forbidden_findings:
    - eth1_network_manager_conflict_probable
    - network_connectivity_failure
    - s20_state_lifecycle_inconsistency_probable

metadata:
  charger_model: 180E
  analyst_note: >
    Monitor for recurrence. During the next event, inspect routes over SSH before
    restarting networking; if routing is normal, swap the orange TCU SIM and compare.
