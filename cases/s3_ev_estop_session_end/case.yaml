id: s3_ev_estop_session_end
title: S3 vehicle emergency stop at session end
detector: ev_estop_at_max_current
input: 'C:\failure case logs\S3errorforsessionend.zip'
scope: charging_session

incident:
  start: '2026-04-14T16:31:50Z'
  end: '2026-04-14T16:32:35Z'

source_selection:
  serial_number: A2492120316
  modules:
    - CCU_Ethernet1
    - CCU_Ethernet2
    - MainProcess
    - Fault_State1
    - charging1
    - ocpp
    - ocppSungrow
  include_rotated: true

ground_truth:
  symptom: Session ended with OCPP vendorErrorCode S3 and Local StopTransaction.
  root_cause: >
    S3 identifies EV_E_Stop: the vehicle initiated an emergency stop. The available
    logs do not establish the vehicle-internal reason that triggered EV_E_Stop.
  confidence: high
  confirmation_status: confirmed
  trigger_hypothesis: >
    Immediately before the C/D-to-B transition, EVTargetCurrent was 295.5 A and
    EVMaximumCurrentLimit was also 295.5 A. A current-output fluctuation near that
    limit might have triggered the EV stop, but this remains unproven.
  missing_proof:
    - High-resolution PCU output-current waveform around 16:32:22–16:32:25 UTC.
    - EV-side diagnostic reason for asserting emergency stop.
  customer_context_needed:
    - EV make and model.
    - EV firmware version.

expected:
  findings:
    - s3_vehicle_emergency_stop
    - ev_estop_at_max_current_possible_fluctuation
  forbidden_findings:
    - eth1_network_manager_conflict_probable
    - normal_ev_stop

