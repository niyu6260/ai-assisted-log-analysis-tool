id: connector2_lem_http_service_hang
title: IDC180E Connector 2 LEM remains pingable while HTTP service hangs
detector: lem2_http_service_hang
input: 'C:\failure case logs\Connector2 Fault issue.zip'
scope: non_charging_incident

incident:
  start: '2026-06-24T09:20:00Z'
  end: '2026-07-01T10:40:00Z'

source_selection:
  serial_number: A2491508085
  modules:
    - MainProcess
    - router_network
  include_rotated: true

ground_truth:
  symptom: >
    Connector 2 repeatedly reports DC-meter communication loss/data errors and
    can remain unavailable until the IDC180E is fully power-cycled. Connector 1
    continues operating normally.
  root_cause: >
    Connector 2's LEM at 192.168.10.2 remained reachable by ICMP but stopped
    responding to its HTTP status service. A full charger power cycle restored
    both v1/v2 status responses and cleared the connector fault. This strongly
    indicates a recoverable hang in the LEM communication/status service.
  confidence: medium
  confirmation_status: probable
  trigger_hypothesis: >
    A LEM application, HTTP task, or internal communication module enters a
    persistent stuck state that survives normal charger operation but clears
    when the meter receives a hardware reset during a full power cycle.
  missing_proof:
    - LEM-internal task, watchdog, exception, and reset-reason logs from the fault period.
    - Packet capture proving whether TCP port 80 connected but HTTP never responded.
    - SN-prefixed MainProcess logs covering the 3 July power cycle and immediate recovery.
    - Firmware release notes or a controlled firmware A/B test reproducing and fixing the hang.
  customer_context_needed:
    - Exact LEM application and sensor firmware versions during each recurrence.
    - Whether only a full charger power cycle works or a targeted LEM reset also recovers it.
    - Recurrence interval after the 3 July reset.

expected:
  findings:
    - connector2_meter_http_timeout_persistent_confirmed
    - connector2_lem_http_service_hang_probable
  forbidden_findings:
    - connector2_internal_ethernet_path_fault_probable
    - broken_ethernet_cable_confirmed
    - external_wan_outage
    - connector1_meter_failure

metadata:
  site: Fines Charging - Burgas - MASTERHAUS Burgas
  charger_model: 180E
