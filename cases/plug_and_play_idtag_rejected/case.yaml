id: plug_and_play_idtag_rejected
title: 30R Plug & Play stops because customer backend rejects charger ID tag
detector: plug_and_play_idtag_rejected
input: 'C:\failure case logs\Plug & Play idtag issue.zip'
scope: charging_session

incident:
  start: '2026-07-10T10:59:20Z'
  end: '2026-07-10T10:59:40Z'

source_selection:
  serial_number: A2581906891
  modules:
    - ocpp
  include_rotated: false

ground_truth:
  symptom: >
    Connector 1 appears to begin charging at 13:59 local time but terminates
    immediately without delivering energy, despite Plug & Play being enabled.
  root_cause: >
    In Plug & Play mode the charger used A2581906891 as the OCPP idTag.
    The customer backend returned idTagInfo.status=Invalid and transactionId=0,
    causing an immediate DeAuthorized stop.
  confidence: high
  confirmation_status: confirmed
  trigger_hypothesis: >
    A2581906891 is missing, disabled, expired, or does not exactly match an
    allowed ID tag in the customer backend.
  missing_proof:
    - Customer-backend ID-tag configuration or audit record showing why the ID was Invalid.
    - Successful Accepted StartTransaction after registering the charger ID.
  customer_context_needed:
    - Backend tenant/site where the Plug & Play ID tag must be registered.
    - Whether ID-tag matching is case-sensitive or constrained by an allowlist.

expected:
  findings:
    - plug_and_play_charger_idtag_rejected_confirmed
  forbidden_findings:
    - charger_failed_to_initiate_transaction
    - charging_firmware_failure
    - vehicle_authorization_failure

