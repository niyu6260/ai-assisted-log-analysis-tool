[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "charger-log-diag"
version = "0.2.0"
description = "Evidence-based complete charger log analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
excel = ["openpyxl>=3.1"]
cloud = [
  "boto3>=1.35",
  "fastapi>=0.115",
  "psycopg[binary]>=3.2",
  "python-multipart>=0.0.12",
  "sqlalchemy>=2.0",
  "uvicorn>=0.32",
]
cloud-dev = [
  "httpx>=0.27",
  "pytest>=8.0",
]

[project.scripts]
charger-log-diag = "charger_log_diag.cli:main"

[tool.setuptools.packages.find]
include = ["ccu_log_diag*", "charger_log_diag*", "charger_log_cloud*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
