  timezone: UTC
  customer_symptom: 'At Avia Rilland, the IDC480E briefly reaches the customer operation backend after
    a reboot, then loses operation-backend communication through the external router that contains the
    customer''s operation SIM.

    '
labels:
  domains:
  - network
  - ocpp
  root_cause_category: external_network_or_backend_path
  root_cause_summary: 'FogNode starts normally and initially completes an Operation WebSocket handshake,
    Accepted BootNotification, and Heartbeat response. At 06:08 the Operation Heartbeat stops receiving
    replies while Maintenance remains connected. The WebSocket closes with code 1006 after the 180-second
    Pong timeout, and subsequent connection attempts to connect.longship.io:80 time out. The fault is
    therefore concentrated in the customer SIM/APN or carrier path to the Operation destination/port,
    customer source-IP policy, or the Longship endpoint. It is not a FogNode, URL-format, DNS, general
    Internet, or physical SIM-card failure.

    '
  conclusion_status: probable
  confidence: medium
  trigger_hypothesis: 'Switching traffic onto the customer SIM exposes destination/port-specific blocking
    between that APN/carrier egress and connect.longship.io:80.

    '
  expected_findings:
  - fognode_and_operation_initial_connection_confirmed
  - operation_pong_timeout_and_reconnect_failure_confirmed
  - customer_sim_to_operation_port_path_probable
  forbidden_findings:
  - network_connectivity_failure
  - maintenance_backend_prolonged_disconnection_confirmed
  - eth1_network_manager_conflict_probable
  evidence: []
  missing_evidence:
  - Packet capture showing whether SYN, TLS/WebSocket handshake, or established-session traffic fails.
  - Customer SIM ICCID, APN, carrier registration, NAT/public source IP, and subscription status.
  - Customer backend and firewall/allowlist logs for the charger source IP.
  - Controlled A/B swap between the customer SIM and a known-good SIM/router.
  recommended_actions: []
