  root_cause_category: power_conversion_or_module
  root_cause_summary: 'The abrupt smart-charging step from approximately 250 kW to 15 kW initiated a dynamic
    ramp-down. The truck reduced EVTargetCurrent gradually, but the charger/PCU output-current reduction
    lagged behind the truck''s changing request by approximately 14-25 A. The sustained tracking error
    triggered S25 after roughly ten seconds and terminated charging.

    '
  conclusion_status: confirmed
  confidence: high
  trigger_hypothesis: 'Profile removal exposed a much lower default profile without a coordinated ramp
    transition. The truck''s slow response to the new 18.9 A EVSE limit prolonged the transient, while
    charger output tracked even more slowly.

    '
