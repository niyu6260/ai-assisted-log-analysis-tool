  root_cause_category: operation_reconnect_boot_state_not_reestablished
  root_cause_summary: 'After a remote code-1006 close, FogNode re-established the Operation WebSocket
    but did not restart the OCPP BootNotification lifecycle. The transport state remained Connected while
    Boot Notification was not accepted for the new connection. Authorize requests were therefore ignored
    locally, an empty AuthorizeConf caused NullPointerException and InternalError, and the terminal surfaced
    NoEnable/S20. The card requests did not reach normal EU-platform authorization.

    '
