    '
labels:
  domains:
  - iso15118
  - power
  root_cause_category: protocol_state_machine
  root_cause_summary: 'CableCheck completes at a higher voltage and the charger commands a voltage drop,
    but PreCharge begins before output voltage has settled close enough to the Tesla target. The remaining
    output-to-request difference exceeds the 12 V safety threshold and triggers an EVSE emergency stop.

    '
  conclusion_status: probable
  confidence: medium
  trigger_hypothesis: 'The discharge path and relay/contactor transition do not have enough time, or are
    not closed-loop verified, before the low-voltage PreCharge request is evaluated.

    '
  expected_findings:
  - precharge_output_over_ev_voltage_protection_confirmed
  - post_cablecheck_residual_voltage_timing_probable
  forbidden_findings:
  - disable_precharge_overvoltage_protection
  - vehicle_invalid_target_voltage
  - cablecheck_isolation_failure
  evidence: []
  missing_evidence:
  - High-rate DC bus and EV-side voltage from CableCheck completion through PreCharge.
  - Relay/contactor command and auxiliary-contact feedback at sub-second resolution.
  - Discharge resistor current and voltage-decay curve.
  - Confirmation of which voltage sensor supplies the 18-39 V difference calculation.
  - Successful post-fix trace on both connectors with the protection still enabled.
  recommended_actions: []
