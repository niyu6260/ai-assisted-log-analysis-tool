labels:
  domains:
  - power
  - iso15118
  root_cause_category: power_conversion_or_module
  root_cause_summary: 'The BMW i3 increases EVTargetCurrent step by step. When output crosses the capacity
    of one 30 kW module, the old PCU logic enables another module and redistributes current. The resulting
    transient output-current drop causes the vehicle to terminate charging.

    '
  conclusion_status: confirmed
  confidence: high
  trigger_hypothesis: 'Avoiding module-count changes during the rising-current phase prevents the transient.
    The updated PCU logic therefore opens two modules immediately when a BMW i3 session is detected.

    '
  expected_findings:
  - bmw_i3_stepwise_target_current_ramp_confirmed
  - bmw_i3_module_switch_current_dip_root_cause
  forbidden_findings:
  - power_module_fault
  - s3_vehicle_emergency_stop
  - ev_invalid_target_voltage_precharge_stop_confirmed
  evidence: []
  missing_evidence:
  - Direct PCU module-on/module-count telegram at the exact current-drop timestamp.
  - High-rate per-module current before and after current redistribution.
  - Successful post-fix trace using the two-module pre-enable logic.
  recommended_actions: []
