  root_cause_category: firmware_regression
  root_cause_summary: 'The logs support a probable stop-code lifecycle or state-synchronization regression:
    S20 is first processed after the connector enters a Finishing state, and later S20 is reported together
    with NoError while the connector is Available or Unavailable. The underlying ISO 15118 timeout trigger
    is not established.

    '
  conclusion_status: probable
  confidence: medium
  trigger_hypothesis: 'S20 should be latched when frame communication times out before unplugging and
    cleared when the connector returns to unplugged/idle. A changed ordering between session state, CCU
    stop-code callback, OCPP status, and LED state may leave a stale indication.

    '
