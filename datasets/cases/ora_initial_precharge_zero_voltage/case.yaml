  timezone: UTC
  customer_symptom: 'Great Wall ORA 07 repeatedly fails to start DC charging. The vehicle ends PreCharge
    normally after the charger output voltage collapses and cannot recover to the later requested battery
    voltage in time.

    '
labels:
  domains:
  - iso15118
  - power
  root_cause_category: protocol_state_machine
  root_cause_summary: 'The first PreCharge message contains no valid EV_Target_V, so the CCU internally
    handles the target as 0 V and collapses output. The vehicle then supplies a valid target near 374
    V, but the power path cannot recover before the vehicle''s approximately seven-second timeout. CCU
    software needs compatibility handling for an initial zero or missing target voltage.

    '
  conclusion_status: confirmed
  confidence: high
  trigger_hypothesis: 'ORA sends its usable battery-voltage target one PreCharge message later than expected.
    Existing CCU logic immediately treats the first absent target as a command to reduce output to zero.

    '
  expected_findings:
  - repeated_initial_precharge_zero_voltage_confirmed
  - zero_target_output_collapse_confirmed
  - ora_precharge_compatibility_software_change_required
  forbidden_findings:
  - charger_hardware_failure
  - charger_fault_code_caused_stop
  - insulation_failure
  evidence: []
  missing_evidence:
  - Raw decoded V2G message fields proving whether EV_TargetVoltage is absent or explicitly zero in the
    first request.
  - PCU allocation and enable-state trace at the instant the CCU processes the zero target.
  - Verification logs after the proposed compatibility software change.
